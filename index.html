<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <section class="intro" aria-labelledby="welcome-heading">
        <div class="portrait-wrap">
          <img
            class="portrait"
            src="IMG_9023.jpg"
            alt="Portrait"
          />
        </div>

        <p class="eyebrow">A little corner of the internet</p>
        <h1 id="welcome-heading">Hello,<br /><em>world.</em></h1>
        <p class="welcome-copy">
          I’m glad you’re here. This is a simple home for curious ideas,
          creative work, and whatever comes next.
        </p>
        <button class="contact-button" type="button">Contact me</button>
      </section>

      <p class="scroll-note" aria-hidden="true">Welcome in <span>✦</span></p>
    </main>
  </body>
</html>
